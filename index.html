<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music View - Home</title>

    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js"></script>

    <link rel="icon" href="favicons/favicon.ico" type="image/x-icon">
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="manifest" href="favicons/site.webmanifest">
  </head>

  <body>
    <div class="title-div">
      <h2 class="title-text">Music View by greb.</h2>

      <a href="https://github.com/grebdev/music-view" target="_blank" style="text-decoration: none;">
        <button class="view-src-button">
          
          <img class="social-logo" src="images/github_logo.svg" draggable="false">
          <p class="social-text">View Source</p>
        </button>
      </a>

      <button class="mode-button" onclick="modeSwitch();">Dark Mode</button>
    </div>

    <div class="search-input-div">
      <input class="search-input js-search-input" placeholder="Enter an artist...">

      <button class="search-button js-search-button">Search</button>
    </div>

    <p class="key-result js-key-result"></p>

    <hr>

    <div class="search-result-div js-search-result-div">Search results appear here...</div>
  </body>

</html>
